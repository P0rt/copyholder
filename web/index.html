<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Copyholder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The cue dot sits at the top centre, right under the camera lens (spec 5.3, 9.2). -->
    <div id="dot" class="dot" hidden aria-hidden="true"></div>
    <main id="screen" class="screen" aria-live="polite">
      <p class="note">Loading...</p>
    </main>
    <!-- Shown while the camera or the microphone runs; Stop turns both off (spec 12.2). -->
    <div id="rec" class="rec" hidden>
      <span class="rec-light" aria-hidden="true"></span>
      <span class="rec-label">Recording</span>
      <button id="stop" class="rec-stop" type="button">Stop</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
